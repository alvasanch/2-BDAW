<!--
1. Formularios
Ejercicio 1: Crea un formulario para registrarse en una plataforma de formación.
Debe solicitar:
• Nombre de usuario. (usuario=..)
• Contraseña. (password=..)
• Repetición de la contraseña. (password2=..)
• Correo electrónico. (correo=..)
• Fecha de nacimiento. (fecha=..)
• Número de teléfono. (teléfono=..)
• Página web personal. (web=..)
• Una casilla “Acepto las condiciones de uso”. (condiciones=on)
• Botón Crear cuenta.
El nombre de usuario, las contraseñas, el correo y la aceptación de las condiciones
deben ser campos obligatorios.
La contraseña debe tener una longitud mínima de 8 caracteres.
Aunque no se especifique siempre hay que indicar el nombre del campo que se
enviará al servidor
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro en plataforma de formación</title>
</head>

<body>

    <h1>Registro en la plataforma de formación</h1>

    <form action="servidor.php" method="post">

        <!-- Nombre de usuario -->
        <label for="usuario">Nombre de usuario:</label>
        <input type="text"
               id="usuario"
               name="usuario"
               required>

        <br><br>

        <!-- Contraseña -->
        <label for="password">Contraseña:</label>
        <input type="password"
               id="password"
               name="password"
               minlength="8"
               required>

        <br><br>

        <!-- Repetición de contraseña -->
        <label for="password2">Repetir contraseña:</label>
        <input type="password"
               id="password2"
               name="password2"
               minlength="8"
               required>

        <br><br>

        <!-- Correo electrónico -->
        <label for="correo">Correo electrónico:</label>
        <input type="email"
               id="correo"
               name="correo"
               required>

        <br><br>

        <!-- Fecha de nacimiento -->
        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date"
               id="fecha"
               name="fecha">

        <br><br>

        <!-- Número de teléfono -->
        <label for="telefono">Número de teléfono:</label>
        <input type="tel"
               id="telefono"
               name="telefono">

        <br><br>

        <!-- Página web personal -->
        <label for="web">Página web personal:</label>
        <input type="url"
               id="web"
               name="web">

        <br><br>

        <!-- Condiciones de uso -->
        <input type="checkbox"
               id="condiciones"
               name="condiciones"
               value="on"
               required>

        <label for="condiciones">
            Acepto las condiciones de uso
        </label>

        <br><br>

        <!-- Botón -->
        <button type="submit">Crear cuenta</button>

    </form>

</body>

</html>
