            <p>
                Málaga es una ciudad situada en la costa de Andalucía.
                Destaca por sus playas, su clima mediterráneo, sus monumentos
                históricos y su gastronomía. Entre sus lugares más conocidos
                se encuentran la Alcazaba, el teatro romano y el Museo Picasso.
