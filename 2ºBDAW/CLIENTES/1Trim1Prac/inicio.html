<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botón</title>
    <script src="ejercicioarray.js"></script>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .boton {
            padding: 12px 24px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 10px;
            display: block;
        }

        .boton:hover {
            background-color: #0056b3;
        }
            
    </style>
</head>

<body>
    <input type="button" class="boton" value="Crear Array" onclick="crearArray();">
   
</body>
</html>
